services:
  connector-service:
    build:
      context: ./connector-service
    container_name: connector-service
    ports:
      - "8080:8080"

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    env_file:
      - ./payment-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"

  webhook-service:
    build:
      context: ./webhook-service
    container_name: webhook-service
    env_file:
      - ./webhook-service/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:8082"
